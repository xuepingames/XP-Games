<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#fff7df">
<title>多了几个？少了几个？｜XP Education</title>
<style>
:root{
  --bg-a:#dff7ff;--bg-b:#fff1c7;--ink:#17324d;--muted:#64748b;
  --main:#26a65b;--main-2:#f59e0b;--accent:#2563eb;--accent-2:#7c3aed;
  --card:rgba(255,255,255,.92);--line:rgba(255,255,255,.82);
  --shadow:0 18px 48px rgba(30,41,59,.17);--soft-shadow:0 10px 24px rgba(30,41,59,.11);
  --item-size:72px;--danger:#ef4444;--success:#16a34a;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
  background:linear-gradient(145deg,var(--bg-a),var(--bg-b));
  -webkit-tap-highlight-color:transparent;transition:background .35s ease;
}
button{font:inherit;touch-action:manipulation}
button:focus-visible{outline:4px solid rgba(37,99,235,.25);outline-offset:2px}
.theme-art{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.theme-art span{position:absolute;filter:drop-shadow(0 8px 12px rgba(15,23,42,.12));animation:float 7s ease-in-out infinite;opacity:.82;user-select:none}
.theme-art span:nth-child(2n){animation-duration:9s;animation-direction:reverse}.theme-art span:nth-child(3n){animation-delay:-3s}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(5deg)}}
.theme-farm{
  --bg-a:#bfe8ff;--bg-b:#fff4bd;--main:#22a857;--main-2:#f3a51d;--accent:#168b4a;--accent-2:#65a30d;
  background:
    radial-gradient(circle at 12% 14%,rgba(255,255,255,.9) 0 4%,transparent 4.3%),
    radial-gradient(circle at 82% 20%,rgba(255,255,255,.75) 0 5%,transparent 5.3%),
    linear-gradient(180deg,#bfe8ff 0 58%,#a9dd76 58% 72%,#6fbd55 72% 100%);
}
.theme-fruit{
  --bg-a:#fff0df;--bg-b:#ffd8df;--main:#f05b78;--main-2:#f08b29;--accent:#d93a70;--accent-2:#f97316;
  background:
    radial-gradient(circle,rgba(255,255,255,.52) 0 5px,transparent 6px) 0 0/32px 32px,
    linear-gradient(145deg,#fff4cf,#ffd9e5 58%,#ffe9bc);
}
.theme-ocean{
  --bg-a:#c7f0ff;--bg-b:#b9d9ff;--main:#0788c9;--main-2:#16b6c9;--accent:#0369a1;--accent-2:#4f46e5;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.6) 0 7px,transparent 8px),
    radial-gradient(circle at 85% 26%,rgba(255,255,255,.46) 0 10px,transparent 11px),
    repeating-radial-gradient(ellipse at 50% 108%,rgba(255,255,255,.28) 0 22px,transparent 24px 54px),
    linear-gradient(180deg,#9de5ff,#56b8ec 58%,#1478bd);
}
.theme-space{
  --bg-a:#141434;--bg-b:#4f1d72;--ink:#f8fafc;--muted:#d8d9f2;--main:#a855f7;--main-2:#06b6d4;--accent:#8b5cf6;--accent-2:#06b6d4;
  --card:rgba(19,18,49,.9);--line:rgba(255,255,255,.14);
  background:
    radial-gradient(circle at 15% 18%,#fff 0 1px,transparent 2px) 0 0/44px 44px,
    radial-gradient(circle at 75% 38%,#fff9 0 1px,transparent 2px) 0 0/67px 67px,
    radial-gradient(circle at 30% 80%,rgba(168,85,247,.45),transparent 35%),
    linear-gradient(145deg,#10102d,#331657 58%,#092d55);
}
.shell{position:relative;z-index:1;width:100%;height:100%;padding:clamp(5px,1.1vw,12px);display:flex;align-items:center;justify-content:center}
.app{width:min(1260px,100%);height:min(820px,100%);border:2px solid var(--line);border-radius:clamp(18px,2.5vw,34px);background:rgba(255,255,255,.42);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);box-shadow:var(--shadow);overflow:hidden;position:relative}
.theme-space .app{background:rgba(15,14,40,.38)}
.screen{display:none;width:100%;height:100%;padding:clamp(9px,1.6vw,20px)}.screen.active{display:block}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand-logo{width:clamp(48px,5.2vw,70px);height:clamp(48px,5.2vw,70px);border-radius:18px;object-fit:contain;background:#fff;padding:3px;box-shadow:var(--soft-shadow);flex:0 0 auto}.brand-text{line-height:1.05;font-weight:1000}.brand-text strong{display:block;font-size:clamp(15px,2vw,24px)}.brand-text small{font-size:clamp(10px,1.1vw,13px);color:var(--muted);font-weight:900}.theme-space .brand-text small{color:#d8d9f2}
/* start */
.start-layout{height:100%;display:grid;grid-template-columns:minmax(360px,.92fr) minmax(460px,1.08fr);gap:clamp(10px,1.5vw,18px)}
.hero{position:relative;overflow:hidden;border-radius:clamp(22px,2.8vw,34px);padding:clamp(18px,2.7vw,34px);background:linear-gradient(145deg,var(--main),var(--main-2));color:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;min-height:0}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.17)}.hero::before{width:300px;height:300px;right:-120px;top:-130px}.hero::after{width:220px;height:220px;left:-90px;bottom:-110px}
.hero .brand{position:relative;z-index:1}.hero .brand-text small{color:#fff;opacity:.9}
.hero-copy{position:relative;z-index:1;margin:auto 0}.hero-tag{display:inline-flex;padding:8px 13px;border:2px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(255,255,255,.18);font-weight:1000;font-size:clamp(13px,1.5vw,17px)}
.hero h1{font-size:clamp(39px,5.4vw,68px);line-height:1.03;margin:18px 0 10px;letter-spacing:-2px}.hero p{font-size:clamp(16px,2vw,23px);font-weight:850;line-height:1.45;margin:0;max-width:520px}
.demo{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.demo-box{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.25);padding:10px;border-radius:20px;text-align:center;font-weight:1000}.demo-icons{font-size:clamp(25px,3vw,40px);line-height:1.2;margin-top:5px}.demo-arrow{font-size:clamp(28px,4vw,48px);font-weight:1000}
.settings{border-radius:clamp(22px,2.8vw,34px);background:var(--card);box-shadow:var(--shadow);padding:clamp(13px,2vw,22px);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.settings-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.settings h2{margin:0;font-size:clamp(22px,2.7vw,32px)}
.sound-toggle,.top-btn{border:0;border-radius:15px;padding:9px 12px;background:rgba(255,255,255,.88);color:#233044;font-weight:1000;box-shadow:var(--soft-shadow);cursor:pointer;white-space:nowrap}.theme-space .sound-toggle,.theme-space .top-btn{background:rgba(255,255,255,.13);color:#fff}
.settings-scroll{overflow:auto;padding:2px 4px 4px;scrollbar-width:thin;flex:1;min-height:0}.setting{padding:9px 0}.setting-label{font-size:14px;font-weight:1000;margin-bottom:7px;display:flex;align-items:center;gap:7px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:2px solid transparent;border-radius:999px;padding:8px 12px;background:#eef2f7;color:#334155;font-size:13px;font-weight:1000;cursor:pointer;box-shadow:inset 0 -2px rgba(15,23,42,.07)}.theme-space .chip{background:rgba(255,255,255,.12);color:#fff}.chip.active{background:linear-gradient(135deg,var(--main),var(--main-2));color:#fff;border-color:rgba(255,255,255,.35);transform:translateY(-1px)}
.theme-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.theme-card{border:3px solid transparent;border-radius:18px;padding:10px 5px;text-align:center;cursor:pointer;font-weight:1000;background:#f8fafc;color:#334155;box-shadow:inset 0 -3px rgba(15,23,42,.06)}.theme-card span{font-size:27px;display:block;margin-bottom:4px}.theme-card.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,255,255,.8),var(--soft-shadow)}.theme-card.farm{background:linear-gradient(#c8efff 0 55%,#9cda72 55%)}.theme-card.fruit{background:radial-gradient(circle,#fff8 0 3px,transparent 4px) 0 0/17px 17px,linear-gradient(145deg,#fff2b4,#ffcbd8)}.theme-card.ocean{background:linear-gradient(#c6f2ff,#42a9df);color:#053b5b}.theme-card.space{background:radial-gradient(circle,#fff 0 1px,transparent 2px) 0 0/16px 16px,linear-gradient(145deg,#18183e,#6b2c8e);color:#fff}
.start-btn{border:0;border-radius:20px;padding:15px 18px;margin-top:9px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:clamp(19px,2vw,25px);font-weight:1000;box-shadow:0 13px 28px color-mix(in srgb,var(--accent) 35%,transparent);cursor:pointer}
/* game */
.game-layout{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:clamp(6px,1vh,10px)}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.game-brand .brand-logo{width:48px;height:48px;border-radius:13px}.game-brand .brand-text strong{font-size:16px}.game-brand .brand-text small{font-size:10px}.progress{text-align:center;font-size:clamp(16px,2vw,22px);font-weight:1000}.top-actions{display:flex;justify-content:flex-end;gap:7px}.score-pill{display:inline-flex;align-items:center;justify-content:center;border-radius:15px;padding:9px 12px;background:rgba(255,255,255,.82);font-weight:1000;box-shadow:var(--soft-shadow);white-space:nowrap}.theme-space .score-pill{background:rgba(255,255,255,.13)}
.stage{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(260px,24vw,310px);gap:clamp(7px,1vw,12px)}
.visual-card,.answer-card{min-height:0;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);border-radius:clamp(20px,2.5vw,30px)}
.visual-card{padding:clamp(8px,1.3vw,14px);display:flex;flex-direction:column}.visual-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px}.phase-title{font-size:clamp(20px,3vw,34px);font-weight:1000}.timer{min-width:74px;text-align:center;padding:8px 12px;border-radius:999px;background:color-mix(in srgb,var(--main) 14%,white);color:color-mix(in srgb,var(--main) 82%,black);border:2px solid color-mix(in srgb,var(--main) 28%,white);font-weight:1000}.theme-space .timer{background:rgba(168,85,247,.2);color:#f5e8ff;border-color:rgba(216,180,254,.3)}
.grid-wrap{flex:1;min-height:0;position:relative;overflow:hidden;border-radius:clamp(17px,2.3vw,27px);background:rgba(255,255,255,.68);border:3px dashed color-mix(in srgb,var(--main) 28%,#dce4ef);padding:clamp(6px,1vw,12px)}.theme-space .grid-wrap{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18)}
.items-grid{width:100%;height:100%;display:grid;align-content:center;justify-content:center;place-items:center;gap:clamp(3px,.7vw,9px)}.item{width:100%;height:100%;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 5px 4px rgba(15,23,42,.14));animation:pop .18s ease both}.item span{font-size:var(--item-size);line-height:.95;display:block;transform-origin:center}@keyframes pop{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}
.compare-layout{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:clamp(7px,1vw,13px)}.compare-box{min-width:0;min-height:0;background:rgba(255,255,255,.76);border:2px solid rgba(148,163,184,.3);border-radius:clamp(15px,2vw,23px);padding:clamp(5px,.8vw,10px);display:grid;grid-template-rows:auto minmax(0,1fr);gap:4px}.theme-space .compare-box{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14)}.compare-title{text-align:center;font-weight:1000;font-size:clamp(14px,1.8vw,21px)}.mini-grid{width:100%;height:100%;min-height:0;display:grid;align-content:center;justify-content:center;place-items:center;gap:clamp(2px,.4vw,6px)}
.answer-card{padding:clamp(9px,1.2vw,14px);display:flex;flex-direction:column;gap:clamp(6px,.9vh,10px)}.mode-badge{align-self:center;background:linear-gradient(135deg,var(--main),var(--main-2));color:#fff;border-radius:999px;padding:7px 13px;font-weight:1000;font-size:14px}.question{display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(24px,3vw,37px);font-weight:1000;line-height:1.05;min-height:54px}.answer-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answer-btn{height:clamp(54px,8.5vh,72px);border:0;border-radius:19px;background:#eef2f7;color:#1e293b;font-size:clamp(25px,3.5vw,37px);font-weight:1000;box-shadow:inset 0 -5px rgba(15,23,42,.08);cursor:pointer;transition:.13s}.theme-space .answer-btn{background:rgba(255,255,255,.12);color:#fff}.answer-btn:not(:disabled):active{transform:translateY(2px)}.answer-btn.correct{background:#dcfce7;color:#166534}.answer-btn.wrong{background:#fee2e2;color:#991b1b}.tools{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tool-btn{border:0;border-radius:15px;padding:10px 8px;font-size:13px;font-weight:1000;cursor:pointer}.peek{background:#dbeafe;color:#1d4ed8}.next{background:#fef3c7;color:#92400e}.tool-btn:disabled{opacity:.42;cursor:not-allowed}.feedback{min-height:57px;display:flex;align-items:center;justify-content:center;text-align:center;border:2px solid rgba(148,163,184,.25);background:rgba(248,250,252,.78);border-radius:18px;padding:8px;font-weight:1000;font-size:clamp(14px,1.55vw,18px)}.theme-space .feedback{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.13)}.feedback.good{background:#dcfce7;color:#166534;border-color:#86efac}.feedback.bad{background:#fee2e2;color:#991b1b;border-color:#fca5a5}.auto-next{text-align:center;color:var(--muted);font-size:12px;font-weight:900;min-height:16px}
/* end */
.end-wrap{height:100%;display:flex;align-items:center;justify-content:center}.end-card{width:min(650px,94%);background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);border-radius:32px;padding:clamp(24px,4vw,46px);text-align:center}.end-card .brand{justify-content:center}.trophy{font-size:78px;margin-top:15px}.end-card h2{font-size:clamp(34px,5vw,52px);margin:4px 0}.final-score{font-size:clamp(27px,3.4vw,38px);font-weight:1000;color:var(--accent);margin:10px 0}.end-message{font-size:18px;font-weight:900;color:var(--muted);margin:0 0 20px}.end-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.end-actions button{border:0;border-radius:18px;padding:13px 20px;font-size:17px;font-weight:1000;cursor:pointer}.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}.secondary{background:#e5e7eb;color:#334155}
@media(max-width:920px),(orientation:portrait){
  .shell{padding:0}.app{width:100%;height:100%;border-radius:0;border:0}.screen{padding:8px}
  .start-layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:8px}.hero{min-height:155px;padding:13px 16px;display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.hero .brand{display:none}.hero-copy{margin:0}.hero-tag{padding:5px 9px;font-size:12px}.hero h1{font-size:clamp(30px,8vw,48px);margin:8px 0 4px}.hero p{font-size:13px}.demo{align-self:center}.demo-box{padding:7px}.demo-icons{font-size:25px}.settings{padding:11px}.setting{padding:7px 0}.theme-cards{gap:5px}.theme-card{font-size:11px;padding:7px 3px}.theme-card span{font-size:23px}
  .stage{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.answer-card{gap:6px}.answer-options{grid-template-columns:repeat(4,1fr)}.answer-btn{height:48px;font-size:25px}.question{min-height:35px;font-size:24px}.feedback{min-height:42px;font-size:14px}.mode-badge{font-size:12px;padding:5px 10px}.tools{grid-template-columns:1fr 1fr}.topbar{grid-template-columns:auto 1fr auto}.game-brand .brand-text{display:none}.game-brand .brand-logo{width:42px;height:42px}.top-btn{font-size:12px;padding:8px 9px}.score-pill{font-size:13px;padding:8px}.phase-title{font-size:23px}.timer{font-size:13px;min-width:65px;padding:6px 9px}
}
@media(max-width:560px){
  .start-layout{grid-template-rows:130px minmax(0,1fr)}.hero{grid-template-columns:1fr .75fr;padding:10px 12px}.hero h1{font-size:31px}.hero p{display:none}.demo-box{font-size:11px}.demo-icons{font-size:20px}.settings-head .brand-logo{width:42px;height:42px}.settings h2{font-size:20px}.chip{font-size:11px;padding:6px 9px}.setting-label{font-size:12px;margin-bottom:5px}.start-btn{padding:11px;font-size:19px;margin-top:5px}
  .screen{padding:5px}.topbar{gap:4px}.progress{font-size:14px}.top-actions{gap:4px}.top-btn{padding:7px;font-size:11px}.score-pill{padding:7px;font-size:12px}.stage{gap:5px}.visual-card{padding:6px}.visual-head{margin-bottom:4px}.phase-title{font-size:19px}.timer{font-size:11px;padding:5px 7px;min-width:56px}.grid-wrap{padding:4px}.answer-card{padding:6px}.question{font-size:21px}.answer-btn{height:42px;font-size:22px;border-radius:14px}.tool-btn{padding:7px 5px;font-size:11px}.feedback{min-height:34px;padding:5px;font-size:12px}.auto-next{font-size:10px;min-height:11px}.mode-badge{font-size:11px}
}
@media(max-height:620px) and (orientation:landscape){
  .hero h1{font-size:43px}.settings{padding:10px}.setting{padding:5px 0}.chip{padding:6px 9px;font-size:11px}.theme-card{padding:5px}.theme-card span{font-size:21px}.start-btn{padding:10px;font-size:18px}
  .game-brand .brand-text{display:none}.answer-btn{height:46px}.feedback{min-height:36px}.question{min-height:36px;font-size:23px}.mode-badge{font-size:11px}.tool-btn{padding:7px}.answer-card{gap:5px}
}
</style>
</head>
<body class="theme-farm">
<div class="theme-art" id="themeArt" aria-hidden="true"></div>
<div class="shell">
<main class="app">
  <section id="startScreen" class="screen active">
    <div class="start-layout">

              <button class="chip" data-value="less">只练少了</button>

          </div>

            <div class="setting-label">🚀 难度</div>

              <button class="chip" data-value="3">Level 3：快闪挑战</button>
            </div>
          </div>
          <div class="setting">
            <div class="setting-label">🔢 数量范围</div>

<script>
const REPLAY_MS = 3000;
const AUTO_NEXT_MS = 4000;
const themes = {
  farm:{icons:['🐥','🐰','🐷','🐮','🐸','🐶','🐱','🦆'],decor:['☁️','🌻','🦋','🌳','🐝','☁️']},
  fruit:{icons:['🍎','🍓','🍊','🍌','🍇','🍉','🍍','🥝'],decor:['🍒','🍋','🍓','🍉','🌿','🍊']},
  ocean:{icons:['🐟','🐠','🐙','🦀','🐬','🐳','🦑','🐡'],decor:['🫧','🐚','🌊','🪸','🫧','⭐']},
  space:{icons:['⭐','🪐','🚀','🌙','☄️','👽','🛸','🌟'],decor:['✨','🪐','☄️','🌙','✨','🚀']}
};
const settings={mode:'mixed',level:1,range:10,showTime:3,questions:5,theme:'farm'};
const state={qIndex:0,score:0,questions:[],current:null,phase:'idle',locked:true,answered:false,timers:[],soundOn:true,audioCtx:null,resizeObserver:null};
const $=id=>document.getElementById(id);
const rand=(min,max)=>Math.floor(Math.random()*(max-min+1))+min;
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=rand(0,i);[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function clearTimers(){state.timers.forEach(id=>{clearTimeout(id);clearInterval(id)});state.timers=[];}
function later(fn,ms){const id=setTimeout(fn,ms);state.timers.push(id);return id;}
function setScreen(id){['startScreen','gameScreen','endScreen'].forEach(x=>$(x).classList.toggle('active',x===id));}
function escapeText(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function applyTheme(name){
  settings.theme=name;
  document.body.className='theme-'+name;
  document.querySelectorAll('.theme-card').forEach(b=>b.classList.toggle('active',b.dataset.value===name));
  const positions=[['7%','12%',48],['86%','10%',42],['5%','72%',52],['88%','69%',56],['44%','3%',32],['48%','84%',42]];
  $('themeArt').innerHTML=themes[name].decor.map((icon,i)=>`<span style="left:${positions[i][0]};top:${positions[i][1]};font-size:${positions[i][2]}px">${escapeText(icon)}</span>`).join('');
}
applyTheme('farm');

document.querySelectorAll('.chips .chip').forEach(btn=>btn.addEventListener('click',()=>{
  const group=btn.parentElement.dataset.group;
  btn.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  settings[group]=['level','range','showTime','questions'].includes(group)?Number(btn.dataset.value):btn.dataset.value;
}));
document.querySelectorAll('.theme-card').forEach(btn=>btn.addEventListener('click',()=>applyTheme(btn.dataset.value)));

function unlockAudio(){
  if(!state.soundOn)return;
  try{
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(AudioContextClass){
      if(!state.audioCtx)state.audioCtx=new AudioContextClass();
      if(state.audioCtx.state==='suspended')state.audioCtx.resume();
      const gain=state.audioCtx.createGain();gain.gain.value=0.00001;gain.connect(state.audioCtx.destination);
      const osc=state.audioCtx.createOscillator();osc.connect(gain);osc.start();osc.stop(state.audioCtx.currentTime+.01);
    }
    if('speechSynthesis' in window){window.speechSynthesis.getVoices();}
  }catch(err){console.warn('Audio unlock skipped:',err);}
}
function tone(freq,start,duration,volume=.08,type='sine'){
  if(!state.soundOn||!state.audioCtx)return;
  const ctx=state.audioCtx;const osc=ctx.createOscillator();const gain=ctx.createGain();
  osc.type=type;osc.frequency.setValueAtTime(freq,ctx.currentTime+start);
  gain.gain.setValueAtTime(.0001,ctx.currentTime+start);gain.gain.exponentialRampToValueAtTime(volume,ctx.currentTime+start+.015);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+start+duration);
  osc.connect(gain);gain.connect(ctx.destination);osc.start(ctx.currentTime+start);osc.stop(ctx.currentTime+start+duration+.02);
}
function playFeedbackSound(correct){
  unlockAudio();if(!state.soundOn||!state.audioCtx)return;
  // 更活泼的儿童游戏提示：上扬、清亮、像小女孩惊喜语气
  if(correct){
    tone(659,0,.10,.08,'sine');
    tone(784,.09,.12,.09,'sine');
    tone(988,.20,.14,.10,'sine');
    tone(1175,.32,.20,.12,'sine');
  }else{
    tone(392,0,.12,.07,'triangle');
    tone(330,.12,.18,.06,'sine');
    tone(392,.30,.14,.07,'triangle');
  }
}
function speakFeedback(text){
  if(!state.soundOn||!('speechSynthesis' in window))return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text+'！');
    u.lang='zh-CN';
    // 可用系统女声时优先使用；不同设备名称不同，所以采用多条件匹配
    const voices=window.speechSynthesis.getVoices();
    u.voice=voices.find(v=>/female|woman|xiaoxiao|xiaoyi|tingting|huihui|meijia|siri|女|中文/i.test(v.name))
      || voices.find(v=>/^zh-(CN|SG|MY)/i.test(v.lang))
      || voices.find(v=>/^zh/i.test(v.lang))
      || null;
    // 较高音调+稍快速度，营造小朋友奖励动画的感觉
    u.rate=1.12;
    u.pitch=1.55;
    u.volume=1;
    window.speechSynthesis.speak(u);
  }catch(err){console.warn('Speech skipped:',err);}
}
function updateSoundButtons(){
  $('soundStartBtn').textContent=state.soundOn?'🔊 声音开':'🔇 声音关';
  $('soundGameBtn').textContent=state.soundOn?'🔊':'🔇';
}
function toggleSound(){state.soundOn=!state.soundOn;updateSoundButtons();if(state.soundOn)unlockAudio();else if('speechSynthesis' in window)window.speechSynthesis.cancel();}

function makeQuestions(){
  const pool=[];let last=null;let guard=0;
  while(pool.length<settings.questions&&guard<3000){
    guard++;
    const mode=settings.mode==='mixed'?(Math.random()<.5?'more':'less'):settings.mode;
    let before,after,diff;
    if(mode==='more'){
      before=rand(1,Math.max(1,settings.range-1));
      diff=rand(1,Math.min(10,settings.range-before));after=before+diff;
    }else{
      before=rand(2,settings.range);diff=rand(1,Math.min(10,before-1));after=before-diff;
    }
    const icons=themes[settings.theme].icons;let icon=icons[rand(0,icons.length-1)];
    if(last&&icon===last.icon)icon=icons[(icons.indexOf(icon)+rand(1,icons.length-1))%icons.length];
    const layoutSeed=rand(1,99999);
    const q={mode,before,after,diff,icon,layoutSeed};
    if(last&&(q.diff===last.diff||(`${q.mode}-${q.before}-${q.after}`===`${last.mode}-${last.before}-${last.after}`)))continue;
    if(pool.some(x=>x.mode===q.mode&&x.before===q.before&&x.after===q.after&&x.icon===q.icon))continue;
    pool.push(q);last=q;
  }
  return pool;
}
function startGame(){
  unlockAudio();clearTimers();if('speechSynthesis' in window)window.speechSynthesis.cancel();
  state.qIndex=0;state.score=0;state.questions=makeQuestions();state.current=null;state.phase='idle';
  setScreen('gameScreen');showQuestion();
}
function restartSame(){startGame();}
function backToStart(){clearTimers();if('speechSynthesis' in window)window.speechSynthesis.cancel();setScreen('startScreen');}

function showQuestion(){
  clearTimers();if(state.qIndex>=state.questions.length){endGame();return;}
  state.current=state.questions[state.qIndex];state.locked=true;state.answered=false;state.phase='original';
  $('progressText').textContent=`题目 ${state.qIndex+1} / ${settings.questions}`;$('scoreText').textContent=`⭐ ${state.score}`;
  $('modeBadge').textContent=state.current.mode==='more'?'⬆️ 多了几个？':'⬇️ 少了几个？';
  $('questionText').textContent='先记住原本数量';$('feedback').className='feedback';$('feedback').textContent='看清楚后再作答 😊';$('countdownText').textContent='';
  $('answerOptions').innerHTML='';$('peekBtn').disabled=true;$('nextBtn').disabled=true;
  renderSingle(state.current.before,state.current.icon,state.current.layoutSeed,false);
  $('phaseTitle').textContent='请看：原本有几个？';runCountdown(settings.showTime,showNowPhase);
}
function runCountdown(seconds,onDone){
  const end=performance.now()+seconds*1000;
  const update=()=>{$('timerPill').textContent=`${Math.max(0,Math.ceil((end-performance.now())/1000))}秒`;};
  update();const interval=setInterval(update,120);state.timers.push(interval);
  later(()=>{clearInterval(interval);onDone();},seconds*1000);
}
function showNowPhase(){
  state.phase='now';state.locked=false;$('phaseTitle').textContent='现在变成这样！';$('timerPill').textContent='作答';
  $('questionText').textContent=state.current.mode==='more'?'多了几个？':'少了几个？';$('feedback').textContent='请选择答案 😊';
  $('peekBtn').disabled=false;renderCurrentView();makeAnswers();
}
function renderCurrentView(){
  const q=state.current;
  if(settings.level===1)renderCompare(q);else renderSingle(q.after,q.icon,q.layoutSeed+37,false);
}
function renderCompare(q){
  $('gridWrap').innerHTML=`<div class="compare-layout"><div class="compare-box"><div class="compare-title">原本</div><div id="beforeMini" class="mini-grid"></div></div><div class="compare-box"><div class="compare-title">现在</div><div id="afterMini" class="mini-grid"></div></div></div>`;
  requestAnimationFrame(()=>{renderInto($('beforeMini'),q.before,q.icon,q.layoutSeed,true);renderInto($('afterMini'),q.after,q.icon,q.layoutSeed+17,true);});
}
function renderSingle(count,icon,seed,compact){
  $('gridWrap').innerHTML='<div id="itemsGrid" class="items-grid"></div>';
  requestAnimationFrame(()=>renderInto($('itemsGrid'),count,icon,seed,compact));
}
function candidateCols(count){
  const ideal=Math.sqrt(count);const vals=new Set([Math.max(1,Math.floor(ideal)),Math.max(1,Math.ceil(ideal)),Math.max(1,Math.round(ideal*1.25)),Math.max(1,Math.round(ideal*1.55))]);
  return [...vals].filter(c=>c<=Math.min(count,8));
}
function renderInto(el,count,icon,seed,compact){
  if(!el)return;const rect=el.getBoundingClientRect();const w=Math.max(rect.width,180),h=Math.max(rect.height,120);
  const choices=candidateCols(count).map(cols=>{const rows=Math.ceil(count/cols);const cell=Math.min((w-(cols-1)*6)/cols,(h-(rows-1)*6)/rows);return{cols,rows,cell};}).sort((a,b)=>b.cell-a.cell);
  const top=choices.slice(0,Math.min(3,choices.length));const chosen=top[seed%top.length]||{cols:1,rows:count,cell:40};
  const maxItemSize=112;const compactMaxItemSize=66;const sizeLimit=compact?compactMaxItemSize:maxItemSize;const minItemSize=compact?18:24;const itemSize=Math.max(minItemSize,Math.min(sizeLimit,Math.floor(chosen.cell*.78)));
  el.style.gridTemplateColumns=`repeat(${chosen.cols},minmax(0,1fr))`;el.style.gridTemplateRows=`repeat(${chosen.rows},minmax(0,1fr))`;el.style.setProperty('--item-size',`${itemSize}px`);el.innerHTML='';
  for(let i=0;i<count;i++){const d=document.createElement('div');d.className='item';d.style.animationDelay=`${i*10}ms`;d.innerHTML=`<span>${escapeText(icon)}</span>`;el.appendChild(d);}
}
function makeAnswers(){
  const correct=state.current.diff;const opts=new Set([correct]);
  const offsets=shuffle([-4,-3,-2,-1,1,2,3,4,5,-5]);
  for(const offset of offsets){const value=correct+offset;if(value>=1&&value<=10)opts.add(value);if(opts.size===4)break;}
  for(let n=1;opts.size<4&&n<=10;n++)opts.add(n);
  $('answerOptions').innerHTML='';shuffle([...opts]).forEach(n=>{const b=document.createElement('button');b.className='answer-btn';b.type='button';b.textContent=n;b.onclick=()=>answer(n,b);$('answerOptions').appendChild(b);});
}
function answer(value,button){
  if(state.locked||state.answered)return;state.locked=true;state.answered=true;$('peekBtn').disabled=true;
  const correct=state.current.diff;document.querySelectorAll('.answer-btn').forEach(b=>{b.disabled=true;if(Number(b.textContent)===correct)b.classList.add('correct');});
  if(value===correct){state.score++;$('scoreText').textContent=`⭐ ${state.score}`;button.classList.add('correct');$('feedback').className='feedback good';$('feedback').textContent='答对了！你真棒！🌟';playFeedbackSound(true);speakFeedback('你真棒');}
  else{button.classList.add('wrong');$('feedback').className='feedback bad';$('feedback').textContent=`继续加油！正确答案是 ${correct}。`;playFeedbackSound(false);speakFeedback('继续加油');}
  $('nextBtn').disabled=false;autoNextCountdown();
}
function autoNextCountdown(){
  const end=performance.now()+AUTO_NEXT_MS;const update=()=>{$('countdownText').textContent=`${Math.max(1,Math.ceil((end-performance.now())/1000))} 秒后自动下一题`;};
  update();const interval=setInterval(update,150);state.timers.push(interval);later(()=>{clearInterval(interval);goNext();},AUTO_NEXT_MS);
}
function goNext(){clearTimers();state.qIndex++;showQuestion();}
function forceNext(){if($('nextBtn').disabled)return;goNext();}
function peekOriginal(){
  if($('peekBtn').disabled||state.phase!=='now'||state.answered)return;
  state.locked=true;$('peekBtn').disabled=true;state.phase='replay';$('phaseTitle').textContent='再看原本 3 秒';
  renderSingle(state.current.before,state.current.icon,state.current.layoutSeed,false);
  const end=performance.now()+REPLAY_MS;const update=()=>{$('timerPill').textContent=`${Math.max(0,Math.ceil((end-performance.now())/1000))}秒`;};update();
  const interval=setInterval(update,120);state.timers.push(interval);
  later(()=>{clearInterval(interval);if(!state.current||state.answered)return;state.phase='now';state.locked=false;$('phaseTitle').textContent='现在变成这样！';$('timerPill').textContent='作答';$('peekBtn').disabled=false;renderCurrentView();},REPLAY_MS);
}
function endGame(){
  clearTimers();setScreen('endScreen');$('finalScore').textContent=`${state.score} / ${settings.questions}`;
  const ratio=state.score/settings.questions;$('finalMessage').textContent=ratio>=.85?'太棒了！你的数量变化感非常敏锐！':ratio>=.6?'做得不错！再挑战一次会更快。':'没关系，先把数量分组观察，再慢慢比较。';
  if(ratio>=.85){playFeedbackSound(true);speakFeedback('挑战完成，你真棒');}
}
function rerender(){if(!$('gameScreen').classList.contains('active')||!state.current)return;if(state.phase==='original'||state.phase==='replay')renderSingle(state.current.before,state.current.icon,state.current.layoutSeed,false);else if(state.phase==='now')renderCurrentView();}
state.resizeObserver=new ResizeObserver(()=>{clearTimeout(state.resizeDebounce);state.resizeDebounce=setTimeout(rerender,90);});state.resizeObserver.observe(document.querySelector('.app'));
window.addEventListener('orientationchange',()=>setTimeout(rerender,260));
window.addEventListener('keydown',event=>{if(!$('gameScreen').classList.contains('active'))return;const n=Number(event.key);if(n>=1&&n<=9){const b=[...document.querySelectorAll('.answer-btn')].find(x=>Number(x.textContent)===n&&!x.disabled);if(b)b.click();}});
updateSoundButtons();
</script>
</body>
