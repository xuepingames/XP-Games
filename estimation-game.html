<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>快速估数量｜数感训练游戏</title>
<style>
  :root{
    --bg1:#fff7e6;
    --bg2:#e6f7ff;
    --card:#ffffffee;
    --ink:#243047;
    --muted:#667085;
    --primary:#ff7a45;
    --primary2:#ffd166;
    --good:#16a34a;
    --bad:#f97316;
    --line:#e6e8ef;
    --shadow: 0 18px 45px rgba(28,40,65,.14);
    --itemSize: 78px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; overflow:hidden; }
  body{
    font-family: "PingFang SC","Microsoft YaHei",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    background: radial-gradient(circle at top left, var(--bg1), transparent 42%),
                radial-gradient(circle at bottom right, var(--bg2), transparent 44%),
                linear-gradient(135deg,#fffdf7,#eef8ff 55%,#fff2f2);
  }
  button, select{ font-family:inherit; }
  .app{
    height:100dvh;
    height:100svh;
    width:100vw;
    padding: clamp(8px, 1.5vw, 18px);
    display:flex;
    flex-direction:column;
    gap: clamp(8px, 1vw, 14px);
  }
  .topbar{
    min-height:62px;
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:10px 14px;
    background:var(--card);
    border:1px solid rgba(255,255,255,.7);
    border-radius:24px;
    box-shadow:var(--shadow);
    backdrop-filter: blur(8px);
  }
  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .logo{
    width: clamp(48px, 7vw, 78px);
    height: clamp(48px, 7vw, 78px);
    object-fit:contain;
    border-radius:16px;
    background:#fff;
    padding:3px;
    box-shadow:0 5px 14px rgba(0,0,0,.08);
    flex:0 0 auto;
  }
  .titleBox{ min-width:0; }
  .title{
    font-size: clamp(20px, 3.1vw, 38px);
    font-weight:900;
    letter-spacing:.02em;
    line-height:1.05;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .subtitle{
    margin-top:4px;
    font-size: clamp(12px, 1.25vw, 16px);
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pill{
    flex:0 0 auto;
    border-radius:999px;
    padding:8px 13px;
    background:linear-gradient(135deg,#fff,#fff2bf);
    border:1px solid rgba(255,203,77,.55);
    font-weight:800;
    color:#8a4b00;
    font-size: clamp(12px,1.5vw,16px);
  }
  .screen{
    flex:1 1 auto;
    min-height:0;
    display:none;
  }
  .screen.active{ display:flex; }

  /* START */
  #startScreen{
    align-items:center;
    justify-content:center;
  }
  .startCard{
    width:min(1060px, 98vw);
    max-height:100%;
    overflow:auto;
    background:var(--card);
    border-radius:32px;
    padding: clamp(16px, 2.4vw, 28px);
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.7);
  }
  .startHead{ text-align:center; margin-bottom:16px; }
  .startHead h1{ margin:0; font-size:clamp(28px,4vw,48px); line-height:1.05; }
  .startHead p{ margin:10px auto 0; max-width:760px; color:var(--muted); font-size:clamp(14px,1.5vw,18px); }
  .settingsGrid{
    display:grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap:14px;
  }
  .settingBox{
    background:#fff;
    border:1px solid var(--line);
    border-radius:22px;
    padding:14px;
  }
  .settingBox.full{ grid-column:1/-1; }
  .label{ font-weight:900; font-size:15px; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .seg{ display:flex; flex-wrap:wrap; gap:8px; }
  .choice{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    min-height:40px;
    border:2px solid #edf0f7;
    background:#fff;
    color:#344054;
    border-radius:16px;
    padding:9px 12px;
    font-weight:800;
    cursor:pointer;
    transition:.18s ease;
    user-select:none;
  }
  .choice:hover{ transform:translateY(-1px); border-color:#ffd166; }
  input[type="radio"]{ position:absolute; opacity:0; pointer-events:none; }
  input[type="radio"]:checked + .choice{
    border-color:var(--primary);
    background:linear-gradient(135deg,#fff4e6,#fff9d6);
    box-shadow:0 8px 20px rgba(255,122,69,.18);
  }
  .startActions{ margin-top:18px; display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
  .primaryBtn{
    border:0;
    color:white;
    background:linear-gradient(135deg,var(--primary),#ff4d6d);
    padding:14px 28px;
    border-radius:999px;
    font-weight:1000;
    font-size:clamp(18px,2.2vw,24px);
    cursor:pointer;
    box-shadow:0 12px 26px rgba(255,90,90,.28);
  }
  .smallNote{ text-align:center; margin-top:12px; color:var(--muted); font-size:13px; }

  /* GAME */
  #gameScreen{
    flex-direction:column;
    gap:10px;
  }
  .gameStatus{
    flex:0 0 auto;
    display:grid;
    grid-template-columns: 1fr auto auto;
    gap:10px;
    align-items:center;
  }
  .statusCard{
    background:var(--card);
    border-radius:22px;
    padding:10px 14px;
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.7);
    font-weight:900;
    min-height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .statusCard.big{ justify-content:flex-start; font-size:clamp(16px,2vw,24px); }
  .statusCard.small{ font-size:clamp(14px,1.5vw,18px); min-width:120px; }
  .playArea{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns: minmax(0, 1.7fr) minmax(210px, .3fr);
    gap:12px;
  }
  .boardPanel,.answerPanel{
    background:var(--card);
    border-radius:28px;
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.7);
    min-height:0;
    overflow:hidden;
  }
  .boardPanel{
    padding: clamp(10px, 1.4vw, 18px);
    display:flex;
    flex-direction:column;
  }
  .boardHint{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:8px;
    font-size:clamp(14px,1.5vw,18px);
    font-weight:900;
  }
  .patternTag{
    padding:7px 12px;
    border-radius:999px;
    background:#fff1d6;
    color:#9a4a00;
    border:1px solid #ffd28a;
    white-space:nowrap;
  }
  .boardWrap{
    flex:1 1 auto;
    min-height:0;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    border-radius:24px;
    background:
      linear-gradient(90deg, rgba(255,255,255,.65) 1px, transparent 1px),
      linear-gradient(0deg, rgba(255,255,255,.65) 1px, transparent 1px),
      linear-gradient(135deg, rgba(255,255,255,.55), rgba(255,255,255,.25));
    background-size: 38px 38px, 38px 38px, auto;
    border:2px dashed rgba(120,130,150,.22);
  }
  .itemBoard{
    display:grid;
    gap: clamp(6px, 1vw, 13px);
    padding: clamp(8px, 1.2vw, 16px);
    border-radius:26px;
    background:rgba(255,255,255,.52);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.45);
  }
  .cell{
    min-width:0;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:18px;
    background:rgba(255,255,255,.66);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 8px 16px rgba(61,84,120,.08);
    transition:.15s ease;
    overflow:hidden;
  }
  .cell .emoji{
    font-size:var(--itemSize);
    line-height:1;
    filter: drop-shadow(0 6px 7px rgba(0,0,0,.12));
    transform: translateY(-1px);
  }
  .cell.hole{
    background:rgba(255,255,255,.25);
    border:2px dashed rgba(120,130,150,.32);
    box-shadow:none;
  }
  .cell.hole::after{
    content:"";
    width:34%; height:34%;
    border-radius:50%;
    background:rgba(180,190,205,.18);
  }
  .hiddenItems .cell:not(.hole) .emoji{ visibility:hidden; }
  .hiddenItems .cell:not(.hole){ background:rgba(255,255,255,.38); box-shadow:none; }
  .coverText{
    position:absolute;
    inset:auto 14px 14px 14px;
    text-align:center;
    font-weight:1000;
    font-size:clamp(16px,2.2vw,26px);
    color:#fff;
    background:rgba(36,48,71,.72);
    padding:10px 16px;
    border-radius:20px;
    pointer-events:none;
    opacity:0;
    transition:.2s ease;
  }
  .hiddenItems + .coverText{ opacity:1; }

  .answerPanel{
    padding: clamp(10px,1.2vw,16px);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .answerTitle{
    flex:0 0 auto;
    text-align:center;
    font-size:clamp(14px,1.6vw,22px);
    font-weight:1000;
    line-height:1.15;
    padding:8px 8px 4px;
  }
  .feedback{
    flex:0 0 auto;
    min-height:46px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:8px;
    font-weight:900;
    background:#f6f8fb;
    color:#475467;
  }
  .feedback.correct{ color:#047857; background:#e9fbf0; }
  .feedback.wrong{ color:#c2410c; background:#fff2e8; }
  .answerGrid{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    gap:7px;
    align-content:center;
  }
  .numBtn{
    border:0;
    border-radius:16px;
    font-weight:1000;
    color:#243047;
    background:linear-gradient(180deg,#ffffff,#f2f6ff);
    box-shadow:0 6px 13px rgba(38,50,75,.12);
    font-size:clamp(14px,1.7vw,20px);
    min-height:32px;
    cursor:pointer;
  }
  .numBtn:hover{ transform:translateY(-1px); }
  .numBtn:disabled{ opacity:.65; cursor:not-allowed; transform:none; }
  .numBtn.correctPick{ background:linear-gradient(180deg,#dcfce7,#86efac); }
  .numBtn.wrongPick{ background:linear-gradient(180deg,#ffedd5,#fdba74); }
  .actionRows{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  .toolBtn{
    border:0;
    border-radius:16px;
    min-height:44px;
    font-weight:1000;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg,#4f46e5,#06b6d4);
    box-shadow:0 8px 16px rgba(79,70,229,.18);
    font-size:clamp(13px,1.4vw,17px);
  }
  .toolBtn.next{ background:linear-gradient(135deg,#f97316,#ef4444); }
  .toolBtn:disabled{ opacity:.52; cursor:not-allowed; }

  /* END */
  #endScreen{ align-items:center; justify-content:center; }
  .endCard{
    width:min(720px,96vw);
    background:var(--card);
    border-radius:34px;
    padding:28px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  .scoreBig{ font-size:clamp(42px,7vw,80px); font-weight:1000; margin:10px 0; color:#ff5a5f; }
  .endCard h2{ margin:0; font-size:clamp(26px,4vw,46px); }
  .endActions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
  .secondaryBtn{
    border:0;
    border-radius:999px;
    padding:12px 20px;
    font-weight:1000;
    color:#243047;
    background:#eef2ff;
    cursor:pointer;
  }

  /* Themes */
  body.theme-coin{ --bg1:#fff3c4; --bg2:#dff7ff; --primary:#ff9f1c; --primary2:#ffe066; }
  body.theme-forest{ --bg1:#dcfce7; --bg2:#e0f2fe; --primary:#22c55e; --primary2:#bbf7d0; }
  body.theme-candy{ --bg1:#ffe4f3; --bg2:#fff7ad; --primary:#ec4899; --primary2:#fbcfe8; }
  body.theme-ocean{ --bg1:#dbeafe; --bg2:#ccfbf1; --primary:#06b6d4; --primary2:#bae6fd; }
  body.theme-space{ --bg1:#efe7ff; --bg2:#e0f2fe; --primary:#8b5cf6; --primary2:#ddd6fe; }

  @media (max-width: 880px){
    .app{ padding:8px; gap:8px; }
    .topbar{ min-height:56px; border-radius:18px; padding:8px 10px; }
    .pill{ display:none; }
    .settingsGrid{ grid-template-columns:1fr; gap:10px; }
    .startCard{ border-radius:24px; }
    .gameStatus{ grid-template-columns:1fr 1fr; }
    .statusCard.big{ grid-column:1/-1; }
    .statusCard.small{ min-width:0; }
    .playArea{ grid-template-columns:1fr; grid-template-rows:minmax(0, 1fr) auto; gap:8px; }
    .answerPanel{ max-height:38dvh; max-height:38svh; }
    .answerTitle{ display:none; }
    .answerGrid{ align-content:start; }
    .boardHint{ font-size:13px; }
    .actionRows{ grid-template-columns:1fr 1fr; }
  }
  @media (max-width: 520px){
    .logo{ width:42px; height:42px; border-radius:12px; }
    .subtitle{ display:none; }
    .title{ font-size:18px; }
    .gameStatus{ display:none; }
    .answerPanel{ max-height:42dvh; max-height:42svh; border-radius:20px; padding:8px; }
    .numBtn{ min-height:30px; border-radius:12px; font-size:15px; }
    .feedback{ min-height:36px; font-size:13px; }
    .toolBtn{ min-height:38px; border-radius:13px; }
    .boardPanel{ border-radius:20px; padding:8px; }
    .boardWrap{ border-radius:16px; }
    .cell{ border-radius:12px; }
  }
</style>
</head>

  <section id="startScreen" class="screen active">
    <div class="startCard">
      <div class="startHead">
        <h1>🎯 快速估数量小游戏</h1>
        <p>选择主题、数量范围和题目类型。题目会固定排成几行几列，帮助学生用分组、乘法表和加减思考来估算。</p>
      </div>

      <div class="settingsGrid">
        <div class="settingBox">
          <div class="label">🎨 主题背景</div>
          <div class="seg" id="themeOptions">
            <label><input type="radio" name="theme" value="coin" checked><span class="choice">🪙 金币乐园</span></label>
            <label><input type="radio" name="theme" value="forest"><span class="choice">🐻 动物森林</span></label>
            <label><input type="radio" name="theme" value="candy"><span class="choice">🍓 食物派对</span></label>
            <label><input type="radio" name="theme" value="ocean"><span class="choice">🐠 海洋世界</span></label>
            <label><input type="radio" name="theme" value="space"><span class="choice">🚀 太空任务</span></label>
          </div>
        </div>

        <div class="settingBox">
          <div class="label">📌 题目类型</div>
          <div class="seg">
            <label><input type="radio" name="pattern" value="regular" checked><span class="choice">规律排列</span></label>
            <label><input type="radio" name="pattern" value="missing"><span class="choice">缺格挑战</span></label>
            <label><input type="radio" name="pattern" value="mixed"><span class="choice">混合</span></label>
          </div>
        </div>

        <div class="settingBox">
          <div class="label">🔢 数量范围</div>
          <div class="seg">
            <label><input type="radio" name="range" value="1-10" checked><span class="choice">1–10</span></label>
            <label><input type="radio" name="range" value="5-20"><span class="choice">5–20</span></label>
            <label><input type="radio" name="range" value="10-30"><span class="choice">10–30</span></label>
            <label><input type="radio" name="range" value="15-40"><span class="choice">15–40</span></label>
          </div>
        </div>

        <div class="settingBox">
          <div class="label">⏱️ 显示时间</div>
          <div class="seg">
            <label><input type="radio" name="showTime" value="2" checked><span class="choice">2秒</span></label>
            <label><input type="radio" name="showTime" value="3"><span class="choice">3秒</span></label>
            <label><input type="radio" name="showTime" value="5"><span class="choice">5秒</span></label>
            <label><input type="radio" name="showTime" value="10"><span class="choice">10秒</span></label>
          </div>
        </div>

        <div class="settingBox">
          <div class="label">📝 题目数量</div>
          <div class="seg">
            <label><input type="radio" name="total" value="5"><span class="choice">5题</span></label>
            <label><input type="radio" name="total" value="10" checked><span class="choice">10题</span></label>
            <label><input type="radio" name="total" value="15"><span class="choice">15题</span></label>
            <label><input type="radio" name="total" value="20"><span class="choice">20题</span></label>
          </div>
        </div>

        <div class="settingBox">
          <div class="label">🔊 鼓励音效</div>

            <label><input type="radio" name="sound" value="on" checked><span class="choice">开启</span></label>
            <label><input type="radio" name="sound" value="off"><span class="choice">关闭</span></label>
          </div>
        </div>

const THEME_ITEMS = {
  coin:   ["🪙","💰","⭐","🔶","🍀","🎁"],
  forest: ["🐻","🐰","🐶","🐱","🐼","🐥","🦊"],
  candy:  ["🍎","🍓","🍌","🍇","🍩","🍪","🧁"],
  ocean:  ["🐠","🐟","🐬","🦀","🐙","⭐","🐚"],
  space:  ["🪐","🚀","🌙","⭐","✨","🛸","☄️"]
};

let config = {};
let qIndex = 0;
let score = 0;
let current = null;
let used = new Set();
let showTimer = null;
let nextTimer = null;
let answerLocked = false;
let audioCtx = null;

function $(id){ return document.getElementById(id); }
function getRadio(name){ return document.querySelector(`input[name="${name}"]:checked`).value; }
function setScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  setTimeout(fitBoard, 50);
}
function applyTheme(theme){
  document.body.className = `theme-${theme}`;
}
document.querySelectorAll('input[name="theme"]').forEach(r=>r.addEventListener('change', e=>applyTheme(e.target.value)));

function parseRange(value){
  const [min,max] = value.split('-').map(Number);
  return {min,max};
}
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function startGame(){
  config = {
    theme:getRadio('theme'),
    pattern:getRadio('pattern'),
    range:parseRange(getRadio('range')),
    showTime:parseFloat(getRadio('showTime')),
    total:parseInt(getRadio('total'),10),
    sound:getRadio('sound') === 'on'
  };
  applyTheme(config.theme);
  qIndex = 0; score = 0; used.clear();
  unlockAudio();
  setScreen('gameScreen');
  nextQuestion();
}
function restartSame(){
  qIndex = 0; score = 0; used.clear();
  setScreen('gameScreen');
  nextQuestion();
}
function backToMenu(){
  clearAllTimers();
  setScreen('startScreen');
}
function clearAllTimers(){
  if(showTimer) clearTimeout(showTimer);
  if(nextTimer) clearInterval(nextTimer);
  showTimer=null; nextTimer=null;
}

function fullGridOptions(min,max){
  const opts=[];
  for(let r=1;r<=6;r++){
    for(let c=1;c<=7;c++){
      const n=r*c;
      if(n>=min && n<=max){
        const wide = Math.max(r,c), tall = Math.min(r,c);
        let rows = tall, cols = wide;
        if(rows === 1 && cols > 5){ rows = Math.ceil(n/5); cols = Math.ceil(n/rows); }
        opts.push({rows, cols, count:n, missing:[], base:n, kind:'regular'});
      }
    }
  }
  // remove duplicates by rows/cols/count
  const seen = new Set();
  return opts.filter(o=>{ const k=`${o.rows}x${o.cols}-${o.count}`; if(seen.has(k)) return false; seen.add(k); return true; });
}

function makeRegularQuestion(){
  const opts = fullGridOptions(config.range.min, config.range.max);
  let o = pick(opts.length ? opts : [{rows:2,cols:5,count:10,missing:[],base:10,kind:'regular'}]);
  return {...o, mode:'regular', hint:`${o.rows} 行 × ${o.cols} 列`, strategy:`看一看：${o.rows} 行 × ${o.cols} 列，可以用乘法表很快算。`};
}

function makeMissingQuestion(){
  const min = config.range.min, max = config.range.max;
  for(let attempt=0; attempt<200; attempt++){
    let rows = randInt(2,6);
    let cols = randInt(3,7);
    let base = rows*cols;
    if(base < min+1 || base > max+6) continue;
    const kind = Math.random()<0.5 ? 'row' : 'col';
    let maxMiss = kind==='row' ? Math.min(cols-1,4) : Math.min(rows-1,4);
    if(maxMiss < 1) continue;
    let miss = randInt(1,maxMiss);
    let count = base - miss;
    if(count < min || count > max) continue;
    let missing=[];
    if(kind === 'row'){
      const row = randInt(0,rows-1);
      const start = cols - miss;
      for(let c=start;c<cols;c++) missing.push(row*cols+c);
    }else{
      const col = randInt(0,cols-1);
      const start = rows - miss;
      for(let r=start;r<rows;r++) missing.push(r*cols+col);
    }
    return {rows, cols, count, base, missing, mode:'missing', hint:`${rows}×${cols} 少 ${miss} 个`, strategy:`先想：${rows} 行 × ${cols} 列，再减掉缺少的 ${miss} 个。`};
  }
  return makeRegularQuestion();
}

function generateQuestion(){
  let mode = config.pattern;
  if(mode === 'mixed') mode = Math.random()<0.5 ? 'regular' : 'missing';
  const items = THEME_ITEMS[config.theme] || THEME_ITEMS.coin;
  for(let attempt=0; attempt<100; attempt++){
    let q = mode === 'missing' ? makeMissingQuestion() : makeRegularQuestion();
    q.emoji = pick(items);
    const sig = `${q.mode}-${q.rows}x${q.cols}-${q.count}-${q.emoji}-${q.missing.join('.')}`;
    if(!used.has(sig) || attempt>70){
      used.add(sig);
      return q;
    }
  }
}

function nextQuestion(){
  clearAllTimers();
  if(qIndex >= config.total){ return endGame(); }
  qIndex++;
  answerLocked = false;
  current = generateQuestion();
  $('questionText').textContent = `题目 ${qIndex}：一共有多少个？`;
  $('progressText').textContent = `第 ${qIndex} / ${config.total} 题`;
  $('timerText').textContent = `观察 ${config.showTime} 秒`;
  $('feedback').className = 'feedback';
  $('feedback').textContent = '先用眼睛看规律，再选择答案。';
  $('patternTag').textContent = current.mode === 'regular' ? '规律排列' : '缺格挑战';
  $('strategyText').textContent = '';
  $('nextBtn').disabled = false;
  $('revealBtn').disabled = true;
  renderBoard(true);
  renderAnswers();
  showTimer = setTimeout(()=>{
    hideBoard();
  }, config.showTime*1000);
}

function renderBoard(visible){
  const board = $('itemBoard');
  board.innerHTML = '';
  board.className = 'itemBoard' + (visible ? '' : ' hiddenItems');
  board.style.gridTemplateColumns = `repeat(${current.cols}, 1fr)`;
  board.style.gridTemplateRows = `repeat(${current.rows}, 1fr)`;
  board.dataset.rows = current.rows;
  board.dataset.cols = current.cols;
  const missingSet = new Set(current.missing || []);
  for(let i=0;i<current.rows*current.cols;i++){
    const cell = document.createElement('div');
    cell.className = 'cell' + (missingSet.has(i) ? ' hole' : '');
    if(!missingSet.has(i)){
      const sp = document.createElement('span');
      sp.className = 'emoji';
      sp.textContent = current.emoji;
      cell.appendChild(sp);
    }
    board.appendChild(cell);
  }
  setTimeout(fitBoard, 20);
}
function hideBoard(){
  $('itemBoard').classList.add('hiddenItems');
  $('timerText').textContent = '请选择答案';
  $('revealBtn').disabled = false;
}
function revealAgain(){
  if(!current || answerLocked) return;
  $('itemBoard').classList.remove('hiddenItems');
  $('timerText').textContent = '再看 3 秒';
  $('revealBtn').disabled = true;
  if(showTimer) clearTimeout(showTimer);
  showTimer = setTimeout(()=>{
    $('itemBoard').classList.add('hiddenItems');
    $('timerText').textContent = '请选择答案';
    $('revealBtn').disabled = false;
  },3000);
}

function renderAnswers(){
  const grid = $('answerGrid');
  grid.innerHTML = '';
  const correct = current.count;
  const min = config.range.min, max = config.range.max;
  let pool = new Set([correct]);
  for(let d=1; pool.size<10 && d<=30; d++){
    [correct-d, correct+d].forEach(v=>{
      if(v>=min && v<=max) pool.add(v);
    });
  }
  while(pool.size<10){
    let v=randInt(min,max);
    pool.add(v);
  }
  let arr=[...pool].sort(()=>Math.random()-0.5);
  grid.style.gridTemplateColumns = `repeat(${arr.length<=5?5:5}, minmax(0, 1fr))`;
  arr.forEach(n=>{
    const btn=document.createElement('button');
    btn.className='numBtn';
    btn.textContent=n;
    btn.onclick=()=>checkAnswer(n,btn);
    grid.appendChild(btn);
  });
}

function checkAnswer(n, btn){
  if(answerLocked) return;
  answerLocked = true;
  if(showTimer) clearTimeout(showTimer);
  $('itemBoard').classList.remove('hiddenItems');
  $('revealBtn').disabled = true;
  const correct = current.count;
  document.querySelectorAll('.numBtn').forEach(b=>{
    b.disabled = true;
    if(parseInt(b.textContent,10) === correct) b.classList.add('correctPick');
  });
  if(n === correct){
    score++;
    btn.classList.add('correctPick');
    $('feedback').className = 'feedback correct';
    $('feedback').textContent = `你真棒！答案是 ${correct}。`;
    playPraise(true);
  }else{
    btn.classList.add('wrongPick');
    $('feedback').className = 'feedback wrong';
    $('feedback').textContent = `继续加油！正确答案是 ${correct}。`;
    playPraise(false);
  }
  startNextCountdown();
}

function startNextCountdown(){
  let sec = 5;
  $('timerText').textContent = `${sec} 秒后下一题`;
  nextTimer = setInterval(()=>{
    sec--;
    if(sec <= 0){ clearInterval(nextTimer); nextTimer=null; goNextQuestion(false); }
    else $('timerText').textContent = `${sec} 秒后下一题`;
  },1000);
}
function goNextQuestion(manual){
  clearAllTimers();
  if(!answerLocked && current){
    // skip current question without score
  }
  nextQuestion();
}
function endGame(){
  clearAllTimers();
  $('finalScore').textContent = `${score} / ${config.total}`;
  const rate = score/config.total;
  $('finalMsg').textContent = rate >= .85 ? '太棒了！你的数量感越来越强！' : rate >= .6 ? '不错哦！继续练习会更快！' : '没关系，慢慢看行和列，会越来越准！';
  setScreen('endScreen');
}

function fitBoard(){
  const wrap = $('boardWrap');
  const board = $('itemBoard');
  if(!wrap || !board || !current) return;
  const ww = wrap.clientWidth - 8;
  const wh = wrap.clientHeight - 8;
  if(ww <= 0 || wh <= 0) return;
  const ratio = current.cols / current.rows;
  let w, h;
  if(ww / wh > ratio){ h = wh; w = h * ratio; }
  else { w = ww; h = w / ratio; }
  board.style.width = Math.max(120,w) + 'px';
  board.style.height = Math.max(90,h) + 'px';
  const cellW = (w - 24 - (current.cols-1)*10) / current.cols;
  const cellH = (h - 24 - (current.rows-1)*10) / current.rows;
  const fs = Math.max(20, Math.min(92, Math.min(cellW, cellH)*0.72));
  board.style.setProperty('--itemSize', fs + 'px');
}
window.addEventListener('resize', ()=>setTimeout(fitBoard, 100));
window.addEventListener('orientationchange', ()=>setTimeout(fitBoard, 250));

function backToSetting(){
  clearAllTimers();
  setScreen('startScreen');
}
function unlockAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function beep(freq=660, duration=.12, type='sine'){
  if(!config.sound) return;
  try{
    unlockAudio();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    o.start(); o.stop(audioCtx.currentTime + duration + .02);
  }catch(e){}
}
function speak(text){
  if(!config.sound || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    // Safari/iPad sometimes needs voices loaded first
    const voices = window.speechSynthesis.getVoices();
    if(voices.length){
      // 优先选择中文女生声音（不同设备名称不同）
      u.voice = voices.find(v=>
        /zh|cmn|Chinese/i.test(v.lang) &&
        /female|woman|girl|xiaoxiao|huihui|tingting|yaoyao|mei|淑|晓|婷|遥|女/i.test(v.name)
      ) || voices.find(v=>
        /zh|cmn|Chinese/i.test(v.lang)
      ) || voices.find(v=>
        /female|woman|girl/i.test(v.name)
      ) || voices[0];
    }
    // 活泼鼓励感：较高音调、稍快速度、尾音更明显
    u.rate = 1.12;
    u.pitch = 1.35;
    u.volume = 1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function playPraise(ok){
  if(ok){ beep(740,.12); setTimeout(()=>beep(980,.15),90); speak('你真棒！'); }
  else { beep(420,.12,'triangle'); setTimeout(()=>beep(520,.12,'triangle'),120); speak('继续加油！'); }
}
</script>

<script>
(function(){
let ctx=null, master=null, timer=null, playing=false;
const isMath = document.title.includes("凑十");
const notes = isMath
 ? [523.25,659.25,783.99,659.25,587.33,698.46,880,698.46]
 : [392,523.25,659.25,523.25,440,587.33,659.25,783.99];
function startMusic(){
 if(playing) return;
 ctx = new (window.AudioContext||window.webkitAudioContext)();
 master=ctx.createGain();
 master.gain.value=0.09;
 master.connect(ctx.destination);
 playing=true;
 let i=0;
 function beat(){
   if(!playing)return;
   const o=ctx.createOscillator();
   const g=ctx.createGain();
   o.type="sine";
   o.frequency.value=notes[i%notes.length];
   g.gain.setValueAtTime(0,ctx.currentTime);
   g.gain.linearRampToValueAtTime(0.12,ctx.currentTime+0.03);
   g.gain.linearRampToValueAtTime(0,ctx.currentTime+0.35);
   o.connect(g);g.connect(master);
   o.start();o.stop(ctx.currentTime+0.4);
   i++;
 }
 beat();
 timer=setInterval(beat,430);
 document.getElementById("xpMusicBtn").textContent="🎵 音乐开";
}
function stopMusic(){
 playing=false;
 if(timer)clearInterval(timer);
 if(ctx)ctx.close();
 document.getElementById("xpMusicBtn").textContent="🔇 音乐关";
}
document.addEventListener("click",function init(){
 if(!playing) startMusic();
 document.removeEventListener("click",init);
},{once:true});
window.addEventListener("load",()=>{
 const b=document.getElementById("xpMusicBtn");
 if(b)b.onclick=(e)=>{e.stopPropagation(); playing?stopMusic():startMusic();}
});
})();
</script>


<script>
// GitHub Pages audio compatibility patch
(function(){
 let ctx=null, started=false;
 function initBgm(){
   try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!ctx) ctx=new AC();
    if(ctx.state==='suspended') ctx.resume();
    if(started) return;
    started=true;
    // gentle continuous melody using Web Audio
    const master=ctx.createGain();
    master.gain.value=0.10;
    master.connect(ctx.destination);
    const notes=[523.25,659.25,783.99,659.25,587.33,659.25,880,783.99];
    let i=0;
    function play(){
      if(!started)return;
      const o=ctx.createOscillator();
      const g=ctx.createGain();
      o.type='sine';
      o.frequency.value=notes[i++%notes.length];
      g.gain.setValueAtTime(0,ctx.currentTime);
      g.gain.linearRampToValueAtTime(0.16,ctx.currentTime+0.05);
      g.gain.linearRampToValueAtTime(0,ctx.currentTime+0.55);
      o.connect(g);g.connect(master);o.start();o.stop(ctx.currentTime+0.6);
      setTimeout(play,600);
    }
    play();
   }catch(e){}
 }
 document.addEventListener('click',function(e){
   const t=e.target;
   if(t && (t.id==='startBtn' || t.closest('#startBtn') || /开始游戏/.test(t.innerText||''))) initBgm();
 }, {capture:true});
 window.addEventListener('touchend',initBgm,{once:false});
})();
</script>
