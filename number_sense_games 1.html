<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XP Education 数感小游戏乐园</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 font-family:"Microsoft YaHei",Arial,sans-serif;
 background:linear-gradient(135deg,#fff5d9,#dff6ff);
 display:flex;align-items:center;justify-content:center;
 padding:20px;
}
.box{
 width:min(1000px,100%);
 background:white;
 border-radius:32px;
 padding:30px;
 box-shadow:0 15px 40px #0002;
 text-align:center;
}
.logo{width:120px;height:120px;object-fit:contain}
h1{color:#8b1e1e;font-size:clamp(30px,5vw,55px);margin:15px 0}
p{font-size:18px;color:#555}
.games{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:20px;
 margin-top:30px;
}
.card{
 background:#f8fbff;
 border-radius:25px;
 padding:25px 15px;
 box-shadow:0 8px 20px #0001;
}
.icon{font-size:60px}
button{
 width:100%;
 border:0;
 border-radius:18px;
 padding:15px;
 background:#b42318;
 color:white;
 font-size:18px;
 font-weight:bold;
 cursor:pointer;
}
@media(max-width:700px){
 .games{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="box">
<img class="logo" src="xp-logo.png">
<h1>XP Education<br>数感小游戏乐园</h1>
<p>玩游戏 · 练数感 · 建立数学思维</p>

<div class="games">
<div class="card">
<div class="icon">👀</div>
<h2>快速估数量</h2>
<p>训练快速观察与数量估算能力</p>
<a href="estimation.html"><button>开始游戏</button></a>
</div>

<div class="card">
<div class="icon">➕</div>
<h2>凑十法</h2>
<p>训练10以内数字组合能力</p>
<a href="make10.html"><button>开始游戏</button></a>
</div>

<div class="card">
<div class="icon">➕➖</div>
<h2>多了几个 少了几个</h2>
<p>训练数量变化与加减思维</p>
<a href="more_less.html"><button>开始游戏</button></a>
</div>
</div>
</div>
</body>
</html>
